services:
  - type: web
    name: aculator
    runtime: image
    image:
      url: ghcr.io/rmz-oz/aculator:latest
    plan: free
    region: frankfurt
    healthCheckPath: /healthz/
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aculator-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # Demo deployment: role switcher and fake data on an empty database (#46).
      - key: DEMO
        value: "1"

databases:
  - name: aculator-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    # Reachable from GitHub Actions for the nightly backup (#32), password and TLS.
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere, password and TLS
