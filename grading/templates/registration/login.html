<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — aculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0D1117; --muted: #5F646C; --line: #B9BCC1; --blue: #1D4ED8; --red: #C21F32; }
    * { box-sizing: border-box; }
    body {
      background: #FFFFFF;
      color: var(--ink);
      font-family: "Schibsted Grotesk", system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    form { width: 300px; padding: 16px; }
    h1 { font-size: 1.3rem; margin: 0 0 20px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 14px 0 4px; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--blue); border-color: var(--blue); }
    button {
      margin-top: 22px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: var(--blue);
      color: #FFFFFF;
      font: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .errors { color: var(--red); font-size: 0.85rem; margin-top: 14px; }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>Sign in</h1>
    {% if form.errors %}
      <p class="errors">Wrong username or password.</p>
    {% endif %}
    <label for="{{ form.username.id_for_label }}">Username</label>
    <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" autofocus required>
    <label for="{{ form.password.id_for_label }}">Password</label>
    <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
