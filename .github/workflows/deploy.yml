name: Deploy

# Runs only after CI has passed on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/rmz-oz/aculator
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ env.SHA }}
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set, image pushed only"; exit 0; fi
          curl -fsS -X POST "$HOOK&imgURL=$(printf %s "$IMAGE:sha-$SHA" | jq -sRr @uri)"
      - name: Wait for the new version
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL not set, skipping"; exit 0; fi
          # The old version keeps answering until Render switches over, so wait for this commit.
          for i in $(seq 1 30); do
            live=$(curl -fsS "$APP_URL/healthz/" | jq -r .version || true)
            [ "$live" = "$SHA" ] && echo "live: $live" && exit 0
            echo "waiting, live is ${live:-down}"
            sleep 10
          done
          echo "$SHA not live after 5 minutes"; exit 1
