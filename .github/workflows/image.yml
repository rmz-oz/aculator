name: Image

# Checks that the Docker image still builds. Pushing happens in Deploy.
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, requirements.txt, config/settings.py]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
