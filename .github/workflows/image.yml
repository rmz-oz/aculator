name: Image

# Checks that the Docker image still builds and that `docker compose up` gives a
# working app with fake data (#81). Pushing happens in Deploy.
on:
  pull_request:
    paths: [Dockerfile, .dockerignore, start.sh, docker-compose.yml, requirements.txt, config/settings.py, grading/demo.py, grading/demo_scenarios.py, grading/management/commands/**]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: The app answers and has the demo data
        run: |
          curl -fsS http://localhost:8000/healthz/
          curl -fsS http://localhost:8000/accounts/login/ | grep -q "Demo, sign in as"
          docker compose exec -T web python manage.py shell -v 0 -c "
          from grading.models import Grade
          from django.contrib.auth import get_user_model
          n = Grade.objects.count(); print(n, 'grades'); assert n > 0
          for u in ('fake_student_0001', 'demo_instructor', 'demo_head'):
              assert get_user_model().objects.get(username=u).groups.exists(), u
          "
      - name: A restart keeps the data and loads nothing twice
        run: |
          before=$(docker compose exec -T web python manage.py shell -v 0 -c "from grading.models import Grade; print(Grade.objects.count())")
          docker compose restart web && docker compose up --detach --wait --wait-timeout 120
          after=$(docker compose exec -T web python manage.py shell -v 0 -c "from grading.models import Grade; print(Grade.objects.count())")
          echo "$before -> $after"; [ "$before" = "$after" ]
      - if: failure()
        run: docker compose logs
